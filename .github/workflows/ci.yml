name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test release version script
        run: bash scripts/tests/test-next-version.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint code and rule packs
        run: make lint
      - name: Build app bundle
        run: make app
