name: Release

# Every push (merge) to main computes the next version from the Conventional Commits since the last
# vX.Y.Z tag (scripts/next-version.sh; rules in CONTRIBUTING.md "Releases & versioning"). When a
# release is due, this workflow builds, tests, tags and publishes it; otherwise it stops after the
# version job.
#
# Build, tag and release all live in this one workflow on purpose: a tag pushed with GITHUB_TOKEN does
# not trigger other workflows (GitHub suppresses runs caused by GITHUB_TOKEN), so a separate
# tag-triggered release workflow would never fire.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Force a release with this version (X.Y.Z, no leading v). Leave empty to compute it from commits."
        required: false
        default: ""

permissions:
  contents: write

# Serialise releases so two quick merges can't compute the same version. A run waits for the one in
# progress (which pushes its tag first); if several are queued, only the newest waits, and it covers
# all commits since the last tag anyway.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Compute version
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags: next-version.sh walks commits since the last tag
      - name: Test version script
        run: bash scripts/tests/test-next-version.sh
      - name: Compute next version
        id: next
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            version="${INPUT_VERSION#v}"
            if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::version input must look like 1.2.3, got '$INPUT_VERSION'"
              exit 1
            fi
          else
            version="$(scripts/next-version.sh)"
          fi
          if [ -n "$version" ] && tag_sha="$(git rev-parse -q --verify "refs/tags/v$version^{commit}")"; then
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::tag v$version already exists on $tag_sha"
              exit 1
            fi
            echo "::notice::tag v$version already points at this commit; re-running the release"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$version" ]; then
            echo "Releasing **$version** (previous: $(scripts/next-version.sh --previous))." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release: no feat, fix, perf or breaking commits since the last tag." >> "$GITHUB_STEP_SUMMARY"
          fi

  release:
    name: Build and publish ${{ needs.version.outputs.version }}
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-15
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # release notes need history and tags; BUILD_NUMBER is the commit count
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint code and rule packs
        run: make lint
      - name: Build universal release assets
        run: make release-assets VERSION="$VERSION" ARCH_FLAGS="--arch arm64 --arch x86_64"
      - name: Check assets
        run: |
          cd build/release
          shasum -a 256 -c SHA256SUMS.txt
          hdiutil verify "OpenClean-$VERSION.dmg"
          for binary in "$GITHUB_WORKSPACE/build/OpenClean.app/Contents/MacOS/OpenClean" \
                        "$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)/openclean"; do
            archs="$(lipo -archs "$binary")"
            echo "$binary: $archs"
            case " $archs " in *" arm64 "*) ;; *) echo "::error::$binary lacks arm64"; exit 1 ;; esac
            case " $archs " in *" x86_64 "*) ;; *) echo "::error::$binary lacks x86_64"; exit 1 ;; esac
          done
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$GITHUB_WORKSPACE/build/OpenClean.app/Contents/Info.plist" | grep -qx "$VERSION"
      - name: Write release notes
        run: scripts/next-version.sh --notes --version "$VERSION" > "$RUNNER_TEMP/release-notes.md"
      - name: Tag v${{ needs.version.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "tag v$VERSION already exists at this commit"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$VERSION" -m "OpenClean $VERSION" "$GITHUB_SHA"
            git push origin "refs/tags/v$VERSION"
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" build/release/* \
            --title "OpenClean $VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --verify-tag
      # TODO: bump Formula/openclean.rb (stable url + sha256 of the source tarball) after a release.
      # Out of scope for now; the formula only supports --HEAD installs.
