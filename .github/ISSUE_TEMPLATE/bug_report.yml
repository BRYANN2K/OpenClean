name: Bug report
description: Something OpenClean did that it should not have, or did not do.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If OpenClean removed something it should never touch (outside a rule's folder, a deny-listed place,
        through a symlink), please report it privately as a
        [security issue](https://github.com/leoAnimesh/OpenClean/security/advisories/new) instead.
        Anything that went to quarantine can be restored from History (`openclean history`).
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options:
        - Smart Scan / cleanup
        - Uninstaller
        - Space Lens
        - Performance / menu bar
        - History / restore
        - Software Update
        - Settings / onboarding
        - CLI
        - Homebrew install
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the rule id if it is about a specific item (see `openclean rules list`).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Smart Scan
        2. ...
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: OpenClean version and macOS version
      description: OpenClean → About OpenClean, or `openclean --version`.
      placeholder: "0.2.1 on macOS 15.4 (Apple Silicon)"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options: [DMG from GitHub Releases, Homebrew cask, Homebrew formula (CLI), Built from source]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste `openclean scan --json` or `openclean history --json` output if relevant. Remove personal paths you do not want to share.
      render: json
