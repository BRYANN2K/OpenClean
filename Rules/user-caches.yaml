pack: user-caches
version: 1
rules:
  - id: user.app-caches
    name: App caches
    category: user
    explain: Per-app cache folders that apps recreate on demand; quit apps first for the best result. Apple system caches, browser caches, IDE history, developer tool caches and test-browser downloads are left alone or handled separately.
    paths:
      - "~/Library/Caches/*"
    exclude:
      - "~/Library/Caches/com.apple.Safari"
      - "~/Library/Caches/Google"
      - "~/Library/Caches/Firefox"
      - "~/Library/Caches/company.thebrowser.Browser"
      - "~/Library/Caches/Homebrew"
      - "~/Library/Caches/CocoaPods"
      - "~/Library/Caches/pip"
      - "~/Library/Caches/Yarn"
      - "~/Library/Caches/CloudKit"
      - "~/Library/Caches/com.apple.bird"
      - "~/Library/Caches/com.apple.*"
      - "~/Library/Caches/JetBrains"
      - "~/Library/Caches/ms-playwright"
      - "~/Library/Caches/org.webkit.Playwright"
      - "~/Library/Caches/Arc"
      - "~/Library/Caches/Microsoft Edge"
      - "~/Library/Caches/BraveSoftware"
      - "~/Library/Caches/deno"
      - "~/Library/Caches/node-gyp"
      - "~/Library/Caches/electron"
      - "~/Library/Caches/electron-builder"
      - "~/Library/Caches/Cypress"
      - "~/Library/Caches/pypoetry"
      - "~/Library/Caches/go-build"
      - "~/Library/Caches/Coursier"
      - "~/Library/Caches/org.swift.swiftpm"
      - "~/Library/Caches/composer"
    safety: regenerable
  - id: user.logs
    name: User logs
    category: user
    explain: Diagnostic logs written by apps. Nothing reads them unless you are troubleshooting.
    paths:
      - "~/Library/Logs/*"
    exclude:
      - "~/Library/Logs/DiagnosticReports"
    safety: regenerable
    conditions:
      min_age_days: 7
