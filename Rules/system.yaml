pack: system
version: 1
rules:
  - id: system.caches
    name: System caches
    category: system
    explain: Caches that system services and installed apps rebuild automatically when needed. Apple's com.apple.* caches and downloaded Siri voices are left alone.
    paths:
      - "/Library/Caches/*"
    exclude:
      - "/Library/Caches/com.apple.*"
      - "/Library/Caches/SiriTTS"
    safety: regenerable
    requires: [admin]
  - id: system.logs
    name: Archived system logs
    category: system
    explain: Rotated, compressed log archives. Current logs are not touched.
    paths:
      - "/private/var/log/*.gz"
      - "/private/var/log/*.bz2"
    safety: regenerable
    requires: [admin]
  - id: timemachine.local-snapshots
    name: Local Time Machine snapshots
    category: system
    explain: Shown for information. macOS deletes local snapshots by itself when it needs the space.
    probe: timemachine.local-snapshots
    safety: review
